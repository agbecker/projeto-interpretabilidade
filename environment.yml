name: interp
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - matplotlib
  - jupyterlab
  - tqdm
  - scikit-learn
  - pip
  - pip:
      # Wheels CUDA 12.4. Confira com `nvidia-smi` no servidor; se o driver
      # suportar outra versão, troque por cu121, cu126 etc.
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch
      - torchvision
      - captum
      - grad-cam
